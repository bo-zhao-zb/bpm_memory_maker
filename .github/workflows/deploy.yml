name: "Deploy production"

on:
  workflow_run:
    workflows: ["Checks"]
    types: ["completed"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        vars.AZURE_DEPLOYMENT_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_ACR_NAME AZURE_RESOURCE_GROUP AZURE_VM_NAME APP_DOMAIN; do
            [[ -n "${!name}" ]] || { echo "Missing repository variable: $name"; exit 1; }
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable image
        id: release
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          release_id="release-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          image_tag="${ACR_NAME}.azurecr.io/bpm-memory-maker:sha-${COMMIT_SHA}"
          az acr login --name "$ACR_NAME"
          docker build \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.version=${release_id}" \
            --tag "$image_tag" .
          docker push "$image_tag"
          digest=$(docker buildx imagetools inspect "$image_tag" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${ACR_NAME}.azurecr.io/bpm-memory-maker@${digest}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Confirm release is still main
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$remote_main" == "$COMMIT_SHA" ]] || {
            echo "A newer main commit exists; refusing to deploy an older release."
            exit 1
          }

      - name: Deploy image to VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          deploy_script=$(base64 --wrap=0 deploy/bpm-deploy)
          compose_file=$(base64 --wrap=0 deploy/compose.production.yml)
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts \
              "echo '$deploy_script' | base64 --decode | sudo tee /usr/local/sbin/bpm-deploy >/dev/null" \
              "sudo chmod 0755 /usr/local/sbin/bpm-deploy" \
              "echo '$compose_file' | base64 --decode | sudo tee /opt/bpm-memory-maker/compose.production.yml >/dev/null" \
              "sudo chmod 0644 /opt/bpm-memory-maker/compose.production.yml" \
              "sudo /usr/local/sbin/bpm-deploy '$IMAGE_REF' '$RELEASE_ID'"

      - name: Verify public deployment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          for attempt in {1..12}; do
            if response=$(curl --fail --silent "https://${APP_DOMAIN}/health/"); then
              [[ "$response" == *"\"release\": \"${RELEASE_ID}\""* ]]
              exit
            fi
            sleep 10
          done
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            gh release create "$RELEASE_ID" \
              --target "$COMMIT_SHA" \
              --title "$RELEASE_ID" \
              --generate-notes
          fi