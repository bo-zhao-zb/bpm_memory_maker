name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memory_maker
          POSTGRES_USER: memory_maker
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_maker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://memory_maker:test-only-password@localhost:5432/memory_maker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py test --verbosity 2

  sqlite:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run SQLite tests
        run: |
          set +e
          uv run python manage.py test --verbosity 2 2>&1 | tee /tmp/sqlite-tests.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            details=$(tail -n 80 /tmp/sqlite-tests.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=SQLite tests failed::${details}"
          fi
          exit "$status"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bpm-memory-maker:check .
      - name: Smoke test production image
        run: |
          docker run --detach --name bpm-memory-maker-check \
            --publish 127.0.0.1:8000:8000 \
            --env APP_RELEASE=container-check \
            --env DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            --env DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost \
            --env DJANGO_MEDIA_ROOT=/tmp/media \
            --env DJANGO_SECRET_KEY=container-check-only-secret-key-with-more-than-fifty-characters \
            --env DATABASE_URL=sqlite:////tmp/container-check.sqlite3 \
            bpm-memory-maker:check
          docker exec bpm-memory-maker-check python manage.py migrate --noinput
          for attempt in {1..12}; do
            if health=$(curl --fail --silent \
              --header "X-Forwarded-Proto: https" \
              http://127.0.0.1:8000/health/) && \
              ready=$(curl --fail --silent \
              --header "X-Forwarded-Proto: https" \
              http://127.0.0.1:8000/ready/) && \
              css_status=$(curl --output /dev/null --write-out '%{http_code}' --silent \
              --header "X-Forwarded-Proto: https" \
              http://127.0.0.1:8000/static/css/app.css); then
              [[ "$health" == *'"release": "container-check"'* ]]
              [[ "$ready" == *'"status": "ready"'* ]]
              [[ "$css_status" == "200" ]]
              exit
            fi
            sleep 5
          done
          docker logs bpm-memory-maker-check
          exit 1
      - name: Container logs
        if: always()
        run: docker logs bpm-memory-maker-check || true